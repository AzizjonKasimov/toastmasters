<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-label="Your story moves left to right for the audience" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="334" rx="12" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Your story moves left to right for the audience</text>
  <text x="24" y="52" font-size="11.5" fill="#59636e">The stage as the audience sees it. One or two steps is enough.</text>

  <rect x="24" y="72" width="712" height="178" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="40" y="94" font-size="11.5" fill="#59636e">Stage</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M285 150H230" marker-end="url(#arrow)"/>
    <path d="M135 124V104H625V124" marker-end="url(#arrow)"/>
    <path d="M530 200H475" marker-end="url(#arrow)"/>
  </g>

  <rect x="40" y="124" width="190" height="106" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="135" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Past</text>
  <text x="135" y="176" text-anchor="middle" fill="#1f2328">Part 2: Tashkent</text>
  <text x="135" y="194" text-anchor="middle" fill="#1f2328">Russian at home</text>
  <text x="135" y="216" text-anchor="middle" font-size="11.5" fill="#59636e">stand on your right side</text>

  <rect x="285" y="124" width="190" height="106" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Now</text>
  <text x="380" y="176" text-anchor="middle" fill="#1f2328">Parts 1, 4, 5, 6</text>
  <text x="380" y="194" text-anchor="middle" fill="#1f2328">Start and finish here</text>
  <text x="380" y="216" text-anchor="middle" font-size="11.5" fill="#59636e">center</text>

  <rect x="530" y="124" width="190" height="106" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="625" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Present</text>
  <text x="625" y="176" text-anchor="middle" fill="#1f2328">Part 3: Korea</text>
  <text x="625" y="194" text-anchor="middle" fill="#1f2328">English and Python</text>
  <text x="625" y="216" text-anchor="middle" font-size="11.5" fill="#59636e">stand on your left side</text>

  <rect x="24" y="266" width="712" height="44" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="380" y="293" text-anchor="middle" fill="#1f2328">Audience: they read your story from left to right</text>
</svg>
